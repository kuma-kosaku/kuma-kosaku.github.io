<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新NISA（積立枠）向け　複利計算シミュレータ</title>
  <link rel="stylesheet" href="../assets/css/base_style.css">
  <link rel="stylesheet" href="css/nisa_simulation.css">
</head>

<body>
  <div id="header"></div>
  <div class="page-info">
    <h2 class="title">新NISA（積立枠）向け　複利計算シミュレータ</h1>
      <p class="description">
        新NISAの積立枠がどんな感じに増えていくかを計算するシミュレータです。<br><br>
        ※積立枠の上限は1080万です。上限に達した場合は追加の積み立てはせずに想定利回りだけで計算します。<br>
        ※想定年間利回りをもとに月利を計算します。月ごとに複利が発生するものとし、月利は以下の式で計算します。<br>
        　　月利の計算式：<i>(1 + 想定年間利回り)<sup>1/12</sup> - 1</i>
      </p>
  </div>

  <main class="container">
    <div class="input-form">
      <label for="monthly">ひと月の積立額：</label>
      <input id="monthly" type="number" value="30000">
    </div>
    <div class="input-form">
      <label for="startMonth">開始年月：</label>
      <input id="startMonth" type="month" value="2025-01">
    </div>
    <div class="input-form">
      <label for="annualRate">想定年間利回り（%）：</label>
      <input id="annualRate" type="number" value="5" step="0.1">
    </div>
    
    <div class="input-form">
      <label for="years">シミュレーション年数：</label>
      <input id="years" type="number" value="20">
    </div>

    <button id="simulate">計算する</button>

    <div id="resultContainer"></div>
  </main>

  <script src="../assets/js/header.js"></script>
  <script src="js/nisa_simulation.js"></script>
</body>

</html>
