<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文字化けダミー作成ツール</title>
  <link rel="stylesheet" href="../assets/css/base_style.css">
  <link rel="stylesheet" href="css/mojibakeee.css">
</head>

<body>
  <div id="header"></div>
  <div class="page-info">
    <h2 class="title">文字化けジェネレーター</h2>
    <p class="description">
      ※このツールは一部の文字をランダムな記号・別文字に置き換えます。<br>
      ※結果は元の文章に戻せません。
    </p>
  </div>
  <div class="container">
    <div class="panel">
      <label for="inputText">元の文章：</label>
      <div>
        <textarea id="inputText" placeholder="ここに文章を入力してください"></textarea>
      </div>
      <div>
        <button id="zalgoButton">Zalgo風に文字化けさせる
      </div>
    </div>
    <div class="panel">
      <label>変換結果：</label>
      <div id="output"></div>
    </div>
  </div>

  <script src="../assets/js/header.js"></script>
  <script src="js/mojibakeee.js"></script>
</body>

</html>
